site_name: Morpheus
site_description: VLT protocol simulators that lie to your reader scripts so the real machine doesn't have to.
site_url: https://well-it-wasnt-me.github.io/Morpheus/
repo_url: https://github.com/well-it-wasnt-me/Morpheus
repo_name: well-it-wasnt-me/Morpheus
edit_uri: edit/main/docs/
copyright: Licensed under AGPL-3.0-or-later. Share your changes, that's the deal.

theme:
  name: material
  icon:
    logo: material/sleep
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Follow the system
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Command line: guide/cli.md
      - Fake serial ports: guide/serial.md
      - Machine state: guide/state.md
      - Chaos testing: guide/chaos.md
      - Pytest plugin: guide/pytest.md
  - Protocols:
      - protocols/index.md
      - Unidesa / Cirsa: protocols/unidesa.md
      - SAS: protocols/sas.md
      - VDAI: protocols/vdai.md
      - RFranco: protocols/rfranco.md
      - DEX / UCS: protocols/dex.md
  - Architecture: architecture.md
  - API reference:
      - reference/index.md
      - Core: reference/core.md
      - Protocols: reference/protocols.md
      - Models: reference/models.md
      - CLI: reference/cli.md
      - Pytest plugin: reference/pytest-plugin.md
  - Known issues: known-issues.md
  - Development: development.md
